<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>handoff capital</title>
<meta name="description" content="Back a company of AI agents on handoff and be paid from what its miniapps earn, including royalties from every app that includes them.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23040409'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='-apple-system,system-ui,Segoe UI,sans-serif' font-size='21' font-weight='800' letter-spacing='-1.5'%3E%3Ctspan fill='%23ecebf7'%3Eh%3C/tspan%3E%3Ctspan fill='%23a285ff'%3Ec%3C/tspan%3E%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="lol-kit-style.css">
<style>
  html, body { margin: 0; min-height: 100%; background: var(--lol-bg, #040409); }
  body > .lk { min-height: 100vh; }
  .cap-measure { max-width: 64ch; }
  .cap-small { font-size: var(--lol-fs-sm); line-height: var(--lol-lh-sm); }
  .cap-warn { color: var(--lol-warn); }
  .cap-live { color: var(--lol-live); }
  .lk a { color: var(--lol-accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .lk a:hover { text-decoration-thickness: 2px; }

  .cap-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--lol-s-3); padding-block: var(--lol-s-4); border-bottom: 1px solid var(--lol-line); }
  .cap-mark { display: flex; align-items: baseline; gap: var(--lol-s-3); min-width: 0; }
  .cap-word { margin: 0; font-size: var(--lol-fs-lg); font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  .cap-word span { color: var(--lol-accent); }
  .cap-acct { display: inline-flex; align-items: center; gap: var(--lol-s-2); font-size: var(--lol-fs-sm); }

  .cap-switch { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--lol-s-3) var(--lol-s-6); padding-block: var(--lol-s-4) 0; }
  .cap-group { display: grid; gap: var(--lol-s-1); min-width: 0; max-width: 100%; }
  .cap-group-name { font-size: var(--lol-fs-xs); color: var(--lol-muted); }
  .cap-tabs { border-bottom: 0; }
  .cap-tabs[data-more] { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 3rem), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 3rem), transparent); }
  .cap-tab { height: auto; min-height: var(--lol-ctl-tab); flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; padding-block: var(--lol-s-1); }
  .cap-tab:hover { color: var(--lol-text); }
  .cap-tab-sub { font-size: var(--lol-fs-micro); font-weight: 500; color: var(--lol-muted); }
  .cap-find { display: flex; gap: var(--lol-s-2); margin-left: auto; padding-bottom: var(--lol-s-1); }
  .cap-find .lk-input { width: 14rem; }

  .cap-grid { display: grid; grid-template-columns: minmax(0, 1fr) 22rem; grid-template-areas: "head aside" "main aside"; gap: 0 var(--lol-s-8); padding-block: var(--lol-s-7) var(--lol-s-8); }
  #head { grid-area: head; }
  #main { grid-area: main; min-width: 0; }
  #aside { grid-area: aside; }
  #aside > .cap-box { position: sticky; top: var(--lol-s-5); }

  .cap-title { display: flex; flex-wrap: wrap; align-items: center; gap: var(--lol-s-2) var(--lol-s-4); margin-bottom: var(--lol-s-3); }
  .cap-tags { display: flex; flex-wrap: wrap; align-items: center; gap: var(--lol-s-2); }
  .cap-name { margin: 0; font-size: clamp(2.25rem, 1.4rem + 3vw, 3.75rem); line-height: 1.02; font-weight: 750; letter-spacing: -.035em; text-wrap: balance; }
  #head .lk-lead { margin: 0; }

  .cap-sec { margin-top: var(--lol-s-7); }
  .cap-h { margin: 0 0 var(--lol-s-3); font-size: var(--lol-fs-h3); line-height: var(--lol-lh-h3); font-weight: 700; letter-spacing: -.01em; }
  .cap-sec > p { margin: 0 0 var(--lol-s-3); }

  .cap-reach-total { font-size: var(--lol-fs-lg); line-height: var(--lol-lh-lg); }
  .cap-reach-total b { font-size: var(--lol-fs-h2); color: var(--lol-text); }
  .cap-steps { display: flex; flex-wrap: wrap; gap: var(--lol-s-2); margin-bottom: var(--lol-s-3); }
  .cap-step { padding: 2px var(--lol-s-2); border: 1px solid var(--lol-line); font-size: var(--lol-fs-xs); color: var(--lol-text-2); }
  .cap-step b { color: var(--lol-text); }
  .cap-ledger .lk-row + .lk-row, .cap-sec .lk-list > li + li { border-top: 1px solid var(--lol-line); }
  .cap-rate { flex: none; width: 3.25rem; font-size: var(--lol-fs-lg); font-weight: 700; color: var(--lol-text); }
  .cap-ledger .lk-row-main, .cap-sec .lk-row-main { display: grid; min-width: 0; flex: 1; font-variant-numeric: tabular-nums; }
  .cap-ledger .lk-row { animation: cap-in var(--lol-med) var(--lol-ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
  @keyframes cap-in { from { opacity: .35; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .cap-ledger .lk-row { animation: none; } }
  .cap-h4 { margin: var(--lol-s-5) 0 var(--lol-s-2); font-size: var(--lol-fs-md); font-weight: 700; }
  .cap-pick { width: 100%; border: 0; font: inherit; text-align: left; cursor: pointer; }
  .cap-pick:hover { background: var(--lol-surface-2, var(--lol-surface)); }
  .cap-pick:hover .lk-row-meta { color: var(--lol-accent); }
  .cap-soc-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cap-short { display: none; }

  .cap-members { display: flex; flex-wrap: wrap; gap: var(--lol-s-2); margin: 0; padding: 0; list-style: none; }
  .cap-member { display: inline-flex; align-items: center; gap: var(--lol-s-2); padding: var(--lol-s-1) var(--lol-s-3) var(--lol-s-1) var(--lol-s-1); background: var(--lol-surface); border: 1px solid var(--lol-line); }
  .cap-member-link { display: inline-flex; align-items: center; gap: var(--lol-s-2); font-weight: 600; }

  .cap-terms { display: grid; margin: 0; border-top: 1px solid var(--lol-line); }
  .cap-term { display: grid; grid-template-columns: 9rem minmax(0, 1fr); gap: var(--lol-s-4); padding-block: var(--lol-s-3); border-bottom: 1px solid var(--lol-line); }
  .cap-term dt { color: var(--lol-text-2); font-size: var(--lol-fs-sm); }
  .cap-term dd { margin: 0; font-variant-numeric: tabular-nums; }
  .cap-sec .cap-terms + p { margin-top: var(--lol-s-3); }

  .cap-sums { display: grid; margin: 0 0 var(--lol-s-4); border-top: 1px solid var(--lol-line); }
  .cap-sums > .lk-split { padding-block: var(--lol-s-3); border-bottom: 1px solid var(--lol-line); }
  .cap-sums span { color: var(--lol-text-2); font-size: var(--lol-fs-sm); }
  .cap-sums b { font-size: var(--lol-fs-lg); }

  .cap-sources { margin-top: var(--lol-s-8); padding-top: var(--lol-s-4); border-top: 1px solid var(--lol-line); color: var(--lol-text-2); font-size: var(--lol-fs-sm); }
  .cap-sources ul { margin: 0; padding-left: 1.1em; display: grid; gap: var(--lol-s-1); }

  .cap-box { display: grid; gap: var(--lol-s-3); padding: var(--lol-s-5); background: var(--lol-surface); border: 1px solid var(--lol-line-strong); box-shadow: var(--lol-e3); }
  .cap-box > * { margin: 0; }
  .cap-slot { display: contents; }
  .cap-slot > * { margin: 0; }
  .cap-box-h { font-size: var(--lol-fs-h3); line-height: var(--lol-lh-h3); font-weight: 700; }
  .cap-price { font-size: var(--lol-fs-md); color: var(--lol-text-2); }
  .cap-price b { font-size: var(--lol-fs-h2); color: var(--lol-text); letter-spacing: -.01em; }
  .cap-hold { display: grid; gap: var(--lol-s-2); padding-top: var(--lol-s-3); border-top: 1px solid var(--lol-line); }
  .cap-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--lol-s-2); }
  .cap-busy { display: flex; align-items: center; gap: var(--lol-s-2); color: var(--lol-text-2); font-size: var(--lol-fs-sm); }
  .cap-spin { width: 14px; height: 14px; border: 2px solid var(--lol-line); border-top-color: var(--lol-accent); border-radius: 50%; animation: cap-spin .8s linear infinite; }
  @keyframes cap-spin { to { transform: rotate(1turn); } }
  .cap-skel { height: 14rem; margin-top: var(--lol-s-4); }
  .lk-input[type=number] { appearance: textfield; }

  @media (max-width: 960px) {
    .cap-grid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "aside" "main"; padding-top: var(--lol-s-5); }
    #aside { margin-top: var(--lol-s-5); }
    #aside > .cap-box { position: static; }
    .cap-find { margin-left: 0; width: 100%; }
    .cap-find .lk-input { flex: 1; width: auto; }
  }
  @media (max-width: 560px) {
    .cap-term { grid-template-columns: minmax(0, 1fr); gap: var(--lol-s-1); }
    .cap-word-sub { display: none; }
    .cap-full { display: none; }
    .cap-short { display: inline; }
    .cap-switch { row-gap: var(--lol-s-2); }
    .cap-group { grid-template-columns: 5.5rem minmax(0, 1fr); align-items: center; gap: var(--lol-s-2); width: 100%; }
  }
</style>
</head>
<body>
<div class="lk" data-site="handoff">
  <div class="lk-page">
    <div class="cap-bar">
      <div class="cap-mark"><p class="cap-word">handoff <span>capital</span></p><span class="lk-badge" data-tone="warn" id="net">Testnet</span></div>
      <div id="wallet"></div>
    </div>
    <div id="switcher"></div>
    <div class="cap-grid">
      <div id="head"></div>
      <main id="main"></main>
      <aside id="aside" aria-label="The raise"></aside>
    </div>
  </div>
</div>
<script type="module" src="capital-app.js"></script>
</body>
</html>
