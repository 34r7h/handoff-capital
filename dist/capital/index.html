<script>
'use strict';
const __mods = {};
__mods["lib.js"] = (() => {
// Pure functions shared by the browser app, the smoke script and the tests.
// No I/O and no DOM here: everything takes plain data (or an injected fetch
// function) and returns plain data.

const TRANSFER_TOPIC = '0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
const TRANSFER_SELECTOR = '0xa9059cbb';
const UINT256_MAX = (1n << 256n) - 1n;
const CAP_DECIMALS = 6; // the mainnet cap is kept in 6-decimal dollar units
const STABLECOINS = ['USDC', 'USDG']; // dollar stablecoins a task may be priced in

const ADDRESS_RE = /^0x[0-9a-fA-F]{40}$/;
const TX_RE = /^0x[0-9a-fA-F]{64}$/;

function isAddress(v) {
  return typeof v === 'string' && ADDRESS_RE.test(v);
}

function sameAddress(a, b) {
  return isAddress(a) && isAddress(b) && a.toLowerCase() === b.toLowerCase();
}

function isTxHash(v) {
  return typeof v === 'string' && TX_RE.test(v);
}

function shortAddress(a) {
  return isAddress(a) ? `${a.slice(0, 6)}…${a.slice(-4)}` : String(a ?? '');
}

// ---------------------------------------------------------------- amounts

// "1.5e-7" -> "0.00000015". Works on the decimal string, never on floats.
function expandExponent(s) {
  const m = /^(\d*)(?:\.(\d*))?e([+-]?\d+)$/i.exec(s);
  if (!m) throw new RangeError(`not a decimal amount: ${s}`);
  const intPart = m[1] || '';
  const fracPart = m[2] || '';
  const digits = (intPart + fracPart).replace(/^0+(?=\d)/, '') || '0';
  const lead = (intPart + fracPart).length - digits.length; // zeros stripped from the front
  const point = intPart.length - lead + Number(m[3]);
  if (point <= 0) return `0.${'0'.repeat(-point)}${digits}`;
  if (point >= digits.length) return digits + '0'.repeat(point - digits.length);
  return `${digits.slice(0, point)}.${digits.slice(point)}`;
}

// Decimal amount (string or JS number) -> integer atomic units as a BigInt.
// Exact: "0.05" with 6 decimals is 50000n. Refuses negatives, junk and
// amounts finer than the token can represent (rather than rounding them).
function toAtomic(amount, decimals = 6) {
  if (!Number.isInteger(decimals) || decimals < 0 || decimals > 36) throw new RangeError('bad decimals');
  let s;
  if (typeof amount === 'number') {
    if (!Number.isFinite(amount)) throw new RangeError('amount is not a finite number');
    s = String(amount);
  } else if (typeof amount === 'string') {
    s = amount.trim();
  } else {
    throw new TypeError('amount must be a decimal string or number');
  }
  if (/e/i.test(s)) s = expandExponent(s);
  const m = /^(\d*)(?:\.(\d*))?$/.exec(s);
  if (!m || (m[1] === '' && !m[2])) throw new RangeError(`not a decimal amount: ${String(amount)}`);
  const whole = m[1] || '0';
  const frac = (m[2] || '').replace(/0+$/, '');
  if (frac.length > decimals) throw new RangeError(`${String(amount)} has more than ${decimals} decimal places`);
  return BigInt(whole) * 10n ** BigInt(decimals) + BigInt(frac.padEnd(decimals, '0') || '0');
}

// Atomic units -> "0.05". Keeps at least two decimals and trims the rest.
function formatAtomic(atomic, decimals = 6) {
  const a = BigInt(atomic);
  const neg = a < 0n;
  const abs = neg ? -a : a;
  const base = 10n ** BigInt(decimals);
  let frac = (abs % base).toString().padStart(decimals, '0').replace(/0+$/, '');
  if (frac.length < 2) frac = frac.padEnd(Math.min(2, decimals), '0');
  return `${neg ? '-' : ''}${abs / base}${frac ? `.${frac}` : ''}`;
}

// Re-express an atomic amount with different decimals, rounding down or up.
function scaleAtomic(amount, fromDecimals, toDecimals, roundUp = false) {
  const a = BigInt(amount);
  if (toDecimals >= fromDecimals) return a * 10n ** BigInt(toDecimals - fromDecimals);
  const div = 10n ** BigInt(fromDecimals - toDecimals);
  const q = a / div;
  return roundUp && a % div !== 0n ? q + 1n : q;
}

// A token amount in the cap's 6-decimal units, rounded up so the cap is never undercounted.
const toCapUnits = (amount, decimals = 6) => scaleAtomic(amount, decimals, CAP_DECIMALS, true);

// ---------------------------------------------------------------- calldata and logs

function padTopicAddress(addr) {
  if (!isAddress(addr)) throw new TypeError(`not an address: ${addr}`);
  return `0x${addr.slice(2).toLowerCase().padStart(64, '0')}`;
}

function topicToAddress(topic) {
  if (typeof topic !== 'string' || !/^0x0{24}[0-9a-fA-F]{40}$/.test(topic)) return null;
  return `0x${topic.slice(26).toLowerCase()}`;
}

// ERC-20 transfer(address,uint256) calldata, hand-encoded.
function encodeTransfer(to, atomic) {
  if (!isAddress(to)) throw new TypeError(`not an address: ${to}`);
  if (typeof atomic !== 'bigint') throw new TypeError('amount must be a BigInt in atomic units');
  if (atomic <= 0n || atomic > UINT256_MAX) throw new RangeError('amount out of range');
  return TRANSFER_SELECTOR
    + to.slice(2).toLowerCase().padStart(64, '0')
    + atomic.toString(16).padStart(64, '0');
}

// One eth_getLogs entry -> { from, to, amount, blockNumber, logIndex, txHash, timestamp }.
// Returns null for anything that isn't a plain ERC-20 Transfer log.
function decodeTransferLog(log) {
  if (!log || log.removed) return null;
  const t = log.topics;
  if (!Array.isArray(t) || t.length !== 3 || String(t[0]).toLowerCase() !== TRANSFER_TOPIC) return null;
  const from = topicToAddress(t[1]);
  const to = topicToAddress(t[2]);
  if (!from || !to || typeof log.data !== 'string' || !/^0x[0-9a-fA-F]{64}$/.test(log.data)) return null;
  const hexNum = (v) => (v == null ? null : Number(BigInt(v)));
  return {
    from,
    to,
    amount: BigInt(log.data),
    blockNumber: hexNum(log.blockNumber),
    logIndex: hexNum(log.logIndex),
    txHash: log.transactionHash,
    // Some RPCs send blockTimestamp as "0x0" (Robinhood Chain does, for some
    // logs); zero means unknown, never the epoch.
    timestamp: log.blockTimestamp != null && hexNum(log.blockTimestamp) > 0 ? hexNum(log.blockTimestamp) : null,
  };
}

// ---------------------------------------------------------------- rails

// How to page through eth_getLogs on a rail: start at `initial` blocks per
// query, grow toward `max` after successes, shrink on range/limit errors.
const HANDOFF_SCAN = {
  8453: { initial: 2000, max: 2000, concurrency: 3 }, // Base: 2,000-block cap
  84532: { initial: 1000, max: 1000, concurrency: 3 }, // Base Sepolia: 1,000-block cap
};
const DEFAULT_SCAN = { initial: 1000, max: 5000, concurrency: 2 };

// Rails this app adds on top of handoff's /config/settlement. handoff does not
// settle on these chains; the app only reads them and pays through the wallet.
const APP_RAILS = [
  {
    side: 'mainnet',
    name: 'robinhood',
    aliases: ['robinhood-chain'],
    label: 'Robinhood Chain',
    chainId: 4663,
    token: '0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168',
    symbol: 'USDG',
    decimals: 6,
    rpcUrl: 'https://rpc.mainnet.chain.robinhood.com',
    explorer: 'https://robinhoodchain.blockscout.com/tx/',
    nativeSymbol: 'ETH',
    testnet: false,
    // Its RPC caps a query at 10,000,000 blocks and 10,000 matching logs, not
    // at a small block range, so a quiet payer's weeks fit in a few calls.
    scan: { initial: 10_000_000, max: 10_000_000, concurrency: 1 },
  },
];

function normalizeRail(n, source) {
  const chainId = Number(n.chainId);
  const rail = {
    name: String(n.name ?? `chain-${chainId}`),
    aliases: Array.isArray(n.aliases) ? n.aliases.map(String) : [],
    label: String(n.label ?? n.name ?? `Chain ${chainId}`),
    chainId,
    token: n.token ?? n.usdc,
    symbol: String(n.symbol ?? n.assetName ?? 'USDC'),
    decimals: n.decimals == null ? 6 : Number(n.decimals),
    rpcUrl: n.rpcUrl,
    explorer: n.explorer,
    nativeSymbol: n.nativeSymbol || 'ETH',
    testnet: n.testnet === true,
    source,
    scan: { ...(n.scan || HANDOFF_SCAN[chainId] || DEFAULT_SCAN) },
  };
  if (!Number.isInteger(rail.chainId) || rail.chainId <= 0) throw new Error(`rail ${rail.name}: bad chainId`);
  if (!isAddress(rail.token)) throw new Error(`rail ${rail.name}: bad token address`);
  if (!Number.isInteger(rail.decimals)) throw new Error(`rail ${rail.name}: bad decimals`);
  if (typeof rail.rpcUrl !== 'string' || !/^https?:\/\//.test(rail.rpcUrl)) throw new Error(`rail ${rail.name}: bad rpcUrl`);
  if (typeof rail.explorer !== 'string' || !/^https?:\/\//.test(rail.explorer)) throw new Error(`rail ${rail.name}: bad explorer`);
  return rail;
}

// handoff's /config/settlement is { defaultNetwork, networks: [...] } today; a
// flat { chainId, usdc, ... } object is accepted too. Every rail it lists is
// marked source 'handoff'.
function railsFrom(settlement) {
  if (!settlement || typeof settlement !== 'object') throw new Error('settlement config is empty');
  const list = Array.isArray(settlement.networks) ? settlement.networks : settlement.chainId != null ? [settlement] : [];
  const rails = [];
  for (const n of list) {
    try { rails.push(normalizeRail(n, 'handoff')); } catch { /* skip malformed entries */ }
  }
  if (!rails.length) throw new Error('settlement config lists no usable network');
  return rails;
}

// Every rail on one side: handoff's, then the app's for that side (unless
// handoff already lists the same chain). Throws if handoff's config is unusable,
// so a side never runs on app rails alone.
function railsForSide(side, settlement) {
  const rails = railsFrom(settlement);
  for (const r of APP_RAILS) {
    if (r.side !== side || rails.some((x) => x.chainId === r.chainId)) continue;
    rails.push(normalizeRail(r, 'app'));
  }
  return rails;
}

// handoff's default rail (or the named one) from its own config.
function pickRail(settlement, name) {
  const rails = railsFrom(settlement);
  return rails.find((r) => r.name === name)
    || rails.find((r) => r.name === settlement.defaultNetwork)
    || rails[0];
}

// Does a task's payment.network ("base", "eip155:8453", "8453", …) name this rail?
function railMatchesNetwork(rail, network) {
  const n = String(network || '').trim().toLowerCase();
  if (!n) return false;
  return n === rail.name.toLowerCase()
    || rail.aliases.some((a) => a.toLowerCase() === n)
    || n === `eip155:${rail.chainId}`
    || n === String(rail.chainId);
}

function explorerTxUrl(explorer, tx) {
  if (!isTxHash(tx) || typeof explorer !== 'string' || !explorer) return null;
  return explorer.endsWith('/') ? explorer + tx : `${explorer}/${tx}`;
}

// "paid in USDG (task priced in USDC)" when the token differs from the price.
function tokenLabel(paySymbol, priceCurrency) {
  if (!paySymbol || !priceCurrency || paySymbol.toUpperCase() === priceCurrency.toUpperCase()) return null;
  return `paid in ${paySymbol} (task priced in ${priceCurrency})`;
}

// ---------------------------------------------------------------- tasks

// "handoff-advisor (independent) — did X" -> "handoff-advisor"
function actorId(raw) {
  if (typeof raw !== 'string') return null;
  const m = /^[^\s(—–,;]+/.exec(raw.trim());
  return m ? m[0] : null;
}

// Who verified a task and when. "requester" means the project's requester.
function taskVerification(task, requester) {
  const hist = Array.isArray(task?.status_history) ? task.status_history : [];
  let last = null;
  for (const h of hist) if (h && h.status === 'verified') last = h;
  const at = last ? Date.parse(last.at) : NaN;
  const raw = typeof task?.verified_by === 'string' && task.verified_by.trim() ? task.verified_by : last?.by ?? null;
  let verifier = actorId(raw);
  let viaRequester = false;
  if (verifier && verifier.toLowerCase() === 'requester') {
    viaRequester = true;
    verifier = typeof requester === 'string' && requester ? requester : null;
  }
  return { verifiedAt: Number.isFinite(at) ? at : null, verifier, verifierRaw: raw, viaRequester };
}

// The task's payment terms. Only { amount, currency } objects are trusted;
// a bare number or string has no units, so it is never guessed at.
function readPayment(task, decimals = 6) {
  const p = task?.payment;
  if (p == null) return { ok: false, reason: 'no amount set on the task' };
  if (typeof p !== 'object' || Array.isArray(p)) {
    return { ok: false, reason: `amount "${String(p)}" has no currency or units, so it can't be paid safely` };
  }
  const currency = String(p.currency ?? p.asset ?? 'USDC').toUpperCase();
  if (!STABLECOINS.includes(currency)) return { ok: false, reason: `priced in ${currency}, not a dollar stablecoin this app pays in` };
  if (p.amount == null || p.amount === '') return { ok: false, reason: 'no amount set on the task' };
  let atomic;
  try {
    atomic = toAtomic(p.amount, decimals);
  } catch (e) {
    return { ok: false, reason: `amount "${String(p.amount)}" can't be read (${e.message})` };
  }
  return {
    ok: true,
    atomic,
    text: formatAtomic(atomic, decimals),
    currency,
    network: typeof p.network === 'string' && p.network ? p.network : null,
    payTo: typeof p.pay_to === 'string' && p.pay_to ? p.pay_to : null,
  };
}

// /activity receipts -> Map(taskId -> settled receipt with a tx).
function receiptIndex(activity) {
  const map = new Map();
  for (const r of activity?.receipts || []) {
    if (!r || r.status !== 'settled' || !isTxHash(r.tx)) continue;
    const m = /^task:([0-9a-fA-F-]{36})/.exec(String(r.resource || ''));
    if (!m || map.has(m[1])) continue;
    map.set(m[1], { receiptId: r.id ?? null, tx: r.tx, network: r.network ?? null, amount: r.amount ?? null, payTo: r.payTo ?? null });
  }
  return map;
}

// Every tx hash handoff reports as its own settled payout. Those transfers
// paid something handoff settled, so they never count as the requester's.
function receiptTxSet(activity) {
  const set = new Set();
  for (const r of activity?.receipts || []) {
    if (r && r.status === 'settled' && isTxHash(r.tx)) set.add(r.tx.toLowerCase());
  }
  return set;
}

// Everything the app shows for one project, as plain rows.
// agents: Map(agentId -> { ok: true, agent } | { ok: false, notFound?: true, error?: string })
// receipts: output of receiptIndex(); rails: every rail on this side; payRail: the one the wallet pays on.
//
// Each row has two kinds of blocks:
//   blocks      task-level: no rail can pay it (worker, verifier, amount, payee…)
//   railBlocks  only the selected pay rail can't pay it (named network, custodial wallet)
// `candidate` (task-level only) decides which tasks take part in matching, so
// switching the pay rail never changes which transfer paid which task.
function buildRows({ request, tasks, agents, receipts, payRail, rails = [payRail] }) {
  const rows = [];
  const railByName = new Map(rails.map((r) => [r.name, r]));
  for (const t of tasks || []) {
    if (!t || t.status !== 'verified') continue;
    const v = taskVerification(t, request?.requester);
    const worker = typeof t.assignee === 'string' && t.assignee.trim() ? t.assignee.trim() : null;
    const pay = readPayment(t, payRail.decimals);
    const a = worker ? agents?.get(worker) : undefined;
    const rawWallet = a?.ok ? a.agent?.wallet_address ?? null : null;
    const wallet = isAddress(rawWallet) ? rawWallet : null;
    const custodial = a?.ok ? a.agent?.wallet_custodial === true : false;
    const blocks = [];
    const railBlocks = [];
    let onlyRail = null;

    if (!worker) blocks.push('no worker assigned to the task');
    else if (!a) blocks.push("worker's profile wasn't loaded");
    else if (!a.ok) blocks.push(a.notFound ? `${worker} is not a registered agent` : `couldn't load ${worker}: ${a.error}`);
    else if (!wallet) blocks.push(rawWallet ? "worker's wallet isn't a valid address" : 'worker has no wallet');

    if (!v.verifier) blocks.push(v.viaRequester ? 'verified by "requester", but the project has no requester' : 'no verifier on record');
    else if (worker && v.verifier.toLowerCase() === worker.toLowerCase()) blocks.push('verified by the worker itself');
    else if (worker && typeof t.self_signed_by === 'string' && t.self_signed_by.toLowerCase() === worker.toLowerCase() && !t.co_signed_by) {
      blocks.push('self-signed by the worker with no co-signer');
    }
    if (v.verifiedAt == null) blocks.push('verification time unknown');
    if (t.unpayable === true) blocks.push(t.unpayable_reason ? `handoff marks it unpayable: ${t.unpayable_reason}` : 'handoff marks it unpayable');

    if (!pay.ok) {
      blocks.push(pay.reason);
    } else {
      if (pay.network) {
        const named = rails.find((r) => railMatchesNetwork(r, pay.network));
        if (!named) blocks.push(`task asks to be paid on ${pay.network}, which isn't a rail on this side`);
        else {
          onlyRail = named.name;
          if (named.name !== payRail.name) railBlocks.push(`task asks to be paid on ${named.label}, so only that rail can pay it`);
        }
      }
      if (pay.payTo && !isAddress(pay.payTo)) blocks.push(`task names an invalid payee ${pay.payTo}`);
      else if (pay.payTo && wallet && !sameAddress(pay.payTo, wallet)) blocks.push(`task names payee ${pay.payTo}, which is not the worker's wallet`);
    }
    if (custodial && payRail.source !== 'handoff') railBlocks.push("custodial wallet; handoff doesn't watch this chain");

    const r = receipts?.get(t.id);
    let handoffPaid = null;
    if (r) {
      const net = railByName.get(r.network);
      handoffPaid = { tx: r.tx, network: r.network, url: net ? explorerTxUrl(net.explorer, r.tx) : null, receiptId: r.receiptId, amount: r.amount };
    } else if (t.paid === true) {
      handoffPaid = { tx: null, network: null, url: null, receiptId: t.receipt_id ?? null, amount: null };
    }

    const amountAtomic = pay.ok ? pay.atomic : null;
    const candidate = blocks.length === 0 && !handoffPaid && amountAtomic != null && amountAtomic > 0n;
    rows.push({
      id: t.id,
      title: typeof t.title === 'string' && t.title.trim() ? t.title : '(untitled task)',
      worker,
      wallet,
      custodial,
      amountAtomic,
      amountDecimals: payRail.decimals,
      amountText: pay.ok ? pay.text : null,
      priceCurrency: pay.ok ? pay.currency : null,
      payNote: pay.ok ? tokenLabel(payRail.symbol, pay.currency) : null,
      verifier: v.verifier,
      verifierRaw: v.verifierRaw,
      viaRequester: v.viaRequester,
      verifiedAt: v.verifiedAt,
      handoffPaid,
      blocks,
      railBlocks,
      onlyRail,
      noPaymentDue: amountAtomic === 0n,
      candidate,
      payable: candidate && railBlocks.length === 0,
    });
  }
  rows.sort((a, b) => (a.verifiedAt ?? 0) - (b.verifiedAt ?? 0) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  return rows;
}

// ---------------------------------------------------------------- matching

// Pair tasks with transfers already on chain. Each task gets at most one
// transfer and no transfer is used twice. A transfer counts for a task only if
// it went to the task's worker wallet, was for at least the task amount (after
// scaling both by their own decimals), and was mined after the task was
// verified. Oldest task first, each taking the oldest transfer that fits.
// Transfers from several rails are ordered by time, since block numbers of
// different chains can't be compared.
// tasks: [{ id, wallet, amount: BigInt, decimals?, verifiedAt: ms }]
// transfers: [{ to, amount: BigInt, decimals?, rail?, timestamp: unix s, blockNumber, logIndex, txHash }]
function matchPayments(tasks, transfers) {
  const seen = new Set();
  const pool = [];
  for (const x of transfers) {
    const key = `${x.rail ?? ''}:${x.txHash}:${x.logIndex}`;
    if (seen.has(key)) continue;
    seen.add(key);
    pool.push(x);
  }
  const ts = (x) => (x.timestamp == null ? Infinity : x.timestamp);
  pool.sort((a, b) => ts(a) - ts(b)
    || String(a.rail ?? '').localeCompare(String(b.rail ?? ''))
    || a.blockNumber - b.blockNumber
    || a.logIndex - b.logIndex);
  const order = [...tasks].sort((a, b) => a.verifiedAt - b.verifiedAt || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
  const used = new Set();
  const out = new Map();
  for (const t of order) {
    const need = scaleAtomic(t.amount, t.decimals ?? 6, 18);
    for (let i = 0; i < pool.length; i++) {
      if (used.has(i)) continue;
      const x = pool[i];
      if (!sameAddress(x.to, t.wallet)) continue;
      if (scaleAtomic(x.amount, x.decimals ?? 6, 18) < need) continue;
      if (x.timestamp == null || x.timestamp * 1000 <= t.verifiedAt) continue;
      used.add(i);
      out.set(t.id, x);
      break;
    }
  }
  return out;
}

// Combine per-rail scans into one answer: which tasks each transfer paid, and
// which tasks are covered. A task is covered only when EVERY rail in `rails`
// was checked back to its verification time, so a payment on any of them is
// seen before a Pay button appears.
// scans: Map(railName -> { transfers, coveredFromMs }); rails: the rails that must be checked.
function combineChecks({ rows, scans, rails, handoffTxs = new Set() }) {
  const pool = [];
  let handoffOwned = 0;
  for (const rail of rails) {
    for (const x of scans.get(rail.name)?.transfers || []) {
      if (handoffTxs.has(String(x.txHash).toLowerCase())) { handoffOwned++; continue; }
      pool.push({ ...x, rail: rail.name, decimals: rail.decimals });
    }
  }
  const covered = new Set();
  const tasks = [];
  for (const r of rows) {
    if (!r.candidate) continue;
    const ok = rails.length > 0 && rails.every((rail) => {
      const s = scans.get(rail.name);
      return s && s.coveredFromMs != null && r.verifiedAt >= s.coveredFromMs;
    });
    if (!ok) continue;
    covered.add(r.id);
    tasks.push({ id: r.id, wallet: r.wallet, amount: r.amountAtomic, decimals: r.amountDecimals, verifiedAt: r.verifiedAt });
  }
  return { match: matchPayments(tasks, pool), covered, handoffOwned, transfers: pool.length };
}

// ---------------------------------------------------------------- spending cap

// cap and spent are in CAP_DECIMALS units; amount is in the paying token's
// decimals. cap === null means no cap.
function checkCap({ cap, spent, amount, decimals = 6, unit = 'USDC' }) {
  if (typeof amount !== 'bigint' || amount <= 0n) return { ok: false, reason: 'nothing to pay' };
  if (cap == null) return { ok: true, remaining: null };
  const after = spent + toCapUnits(amount, decimals);
  if (after > cap) {
    return {
      ok: false,
      remaining: cap - spent,
      reason: `Paying ${formatAtomic(amount, decimals)} would bring this session to ${formatAtomic(after, CAP_DECIMALS)} ${unit}, over the ${formatAtomic(cap, CAP_DECIMALS)} ${unit} cap.`,
    };
  }
  return { ok: true, remaining: cap - after };
}

// ---------------------------------------------------------------- log scanning

const isRateLimitError = (e) => e?.code === -32005 || e?.code === 429 || /rate limit|too many requests/i.test(e?.message || '');

// Errors that mean "ask for fewer blocks": block-range caps and result-count
// caps. Rate limits are not among them; those are retried, never shrunk.
function isShrinkableLogError(e) {
  if (!e || isRateLimitError(e)) return false;
  if (e.code === -32000 || e.code === -32614) return true;
  const m = String(e.message || '');
  if (e.code === -32602 && /block|range|spans|allowed/i.test(m)) return true;
  return /exceeds limit|block range|limited to a|range is too|range too|narrow the|exceed.{0,30}(range|blocks)|query returned more than|too many (blocks|results|logs)|response size/i.test(m);
}

// A block-range cap stated in an error, or null. A result-count cap
// ("exceeds limit of 10000") is not a block range and returns null.
//   "eth_getLogs is limited to a 1,000 range"            -> 1000
//   "up to a 2K block range"                              -> 2000
//   "query spans 20000001 blocks …, but only 10000000 are allowed" -> 10000000
function parseRangeLimit(message) {
  const s = String(message || '');
  const m = /only\s+([\d,]+)\s*(k)?\s*(?:blocks?\s*)?(?:are\s+)?allowed/i.exec(s)
    || /([\d,]+)\s*(k)?\s*(?:block\s*)?range/i.exec(s)
    || /range[^\d]{0,30}([\d,]+)\s*(k)?/i.exec(s);
  if (!m) return null;
  const n = Number(m[1].replace(/,/g, '')) * (m[2] ? 1000 : 1);
  return Number.isFinite(n) && n >= 1 ? n : null;
}

// Walk [fromBlock, toBlock] newest first with an injected fetchRange(lo, hi).
// - Up to strategy.concurrency ranges are fetched at once; only results that
//   are contiguous from the top are kept, so coverage never has holes.
// - A shrinkable error shrinks the range to the stated cap (remembered as the
//   new max) or to half, and retries. Any other error is thrown.
// - After two successes in a row the range doubles, up to the max.
// - At most maxCalls fetches; `low` is the lowest block fully covered.
async function scanAdaptive({ fetchRange, fromBlock, toBlock, strategy, maxCalls = Infinity, onProgress }) {
  const items = [];
  let max = Math.max(1, strategy.max ?? strategy.initial);
  let size = Math.max(1, Math.min(strategy.initial, max));
  const concurrency = Math.max(1, strategy.concurrency || 1);
  let cursor = toBlock;
  let calls = 0;
  let streak = 0;
  let shrinks = 0;
  while (cursor >= fromBlock && calls < maxCalls) {
    const ranges = [];
    for (let hi = cursor; ranges.length < concurrency && hi >= fromBlock && calls + ranges.length < maxCalls; ) {
      const lo = Math.max(fromBlock, hi - size + 1);
      ranges.push([lo, hi]);
      hi = lo - 1;
    }
    calls += ranges.length;
    const results = await Promise.allSettled(ranges.map(([lo, hi]) => fetchRange(lo, hi)));
    let failure = null;
    for (let i = 0; i < results.length; i++) {
      if (results[i].status === 'rejected') { failure = { error: results[i].reason, range: ranges[i] }; break; }
      items.push(...(results[i].value || []));
      cursor = ranges[i][0] - 1;
    }
    if (failure) {
      const { error, range: [lo, hi] } = failure;
      const span = hi - lo + 1;
      if (!isShrinkableLogError(error) || span <= 1) throw error;
      const limit = parseRangeLimit(error.message);
      if (limit && limit < span) { size = limit; max = Math.min(max, limit); } else size = Math.max(1, Math.floor(span / 2));
      streak = 0;
      shrinks++;
    } else if (++streak >= 2 && size < max) {
      size = Math.min(max, size * 2);
      streak = 0;
    }
    onProgress?.({ low: cursor + 1, fromBlock, toBlock, calls, size });
  }
  return { items, low: cursor + 1, calls, shrinks, complete: cursor < fromBlock };
}

// ---------------------------------------------------------------- status and proof

// What to show for a row given what the chain checks know.
// check: output of combineChecks(), or null when no wallet has been checked.
function rowStatus(row, check) {
  if (row.handoffPaid) return { kind: 'handoff', tx: row.handoffPaid.tx, url: row.handoffPaid.url };
  if (row.noPaymentDue) return { kind: 'none' };
  const m = check?.match?.get(row.id);
  if (m) return { kind: 'wallet', tx: m.txHash, transfer: m };
  if (row.blocks.length || row.railBlocks?.length) return { kind: 'blocked' };
  if (!check) return { kind: 'unpaid', checked: false };
  if (!check.covered?.has(row.id)) return { kind: 'unchecked' };
  return { kind: 'unpaid', checked: true };
}

// Plain text a requester can paste into handoff by hand. Each payment uses its
// own rail for the chain, token and explorer link.
function proofText({ side, rails, project, payer, rows, check, generatedAt = new Date() }) {
  const railByName = new Map(rails.map((r) => [r.name, r]));
  const lines = [];
  const mine = [];
  const handoff = [];
  for (const r of rows) {
    const s = rowStatus(r, check);
    if (s.kind === 'wallet') mine.push([r, s]);
    else if (s.kind === 'handoff') handoff.push([r, s]);
  }
  lines.push(`handoff pay: payment proof (${side})`);
  if (project) lines.push(`project: ${project.id}${project.title ? ` (${project.title})` : ''}`);
  lines.push(`generated: ${generatedAt.toISOString()}`);
  if (payer) lines.push(`payer wallet: ${payer}`);
  lines.push('');
  const block = ([r, s], by) => {
    lines.push(`task ${r.id}: ${r.title}`);
    lines.push(`  worker: ${r.worker ?? 'unknown'}${r.wallet ? ` (${r.wallet})` : ''}`);
    const price = `${r.amountText ?? '?'} ${r.priceCurrency ?? 'USDC'}`;
    if (s.kind === 'wallet') {
      const rail = railByName.get(s.transfer.rail);
      const sym = rail?.symbol ?? '';
      lines.push(`  amount: ${price} (${formatAtomic(s.transfer.amount, rail?.decimals ?? 6)} ${sym} sent)`);
      const label = tokenLabel(sym, r.priceCurrency ?? 'USDC');
      if (label) lines.push(`  ${label}`);
      lines.push(`  paid by: ${by}`);
      if (rail) lines.push(`  chain: ${rail.label} (${rail.chainId})`);
      lines.push(`  tx: ${s.tx}`);
      const url = rail ? explorerTxUrl(rail.explorer, s.tx) : null;
      if (url) lines.push(`  link: ${url}`);
    } else {
      lines.push(`  amount: ${price}`);
      lines.push(`  paid by: ${by}`);
      const rail = railByName.get(r.handoffPaid?.network);
      if (rail) lines.push(`  chain: ${rail.label} (${rail.chainId})`);
      if (s.tx) {
        lines.push(`  tx: ${s.tx}`);
        if (s.url) lines.push(`  link: ${s.url}`);
      } else {
        lines.push(`  tx: not in handoff's public activity feed${r.handoffPaid?.receiptId ? ` (receipt ${r.handoffPaid.receiptId})` : ''}`);
      }
    }
    lines.push('');
  };
  if (mine.length) {
    lines.push(`Paid from your wallet (${mine.length}):`, '');
    for (const e of mine) block(e, `your wallet${payer ? ` ${payer}` : ''}`);
  }
  if (handoff.length) {
    lines.push(`Paid by handoff (${handoff.length}):`, '');
    for (const e of handoff) block(e, 'handoff');
  }
  if (!mine.length && !handoff.length) lines.push('No paid tasks yet.');
  return lines.join('\n').trimEnd() + '\n';
}

// A project id from a pasted id or a link that contains one.
function extractProjectId(input) {
  const m = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i.exec(String(input || ''));
  return m ? m[0].toLowerCase() : null;
}

// Fixed-size inclusive block ranges, newest first when descending.
function chunkRanges(from, to, size, descending = false) {
  if (!(size >= 1) || to < from) return [];
  const out = [];
  if (descending) {
    for (let hi = to; hi >= from; hi -= size) out.push([Math.max(from, hi - size + 1), hi]);
  } else {
    for (let lo = from; lo <= to; lo += size) out.push([lo, Math.min(to, lo + size - 1)]);
  }
  return out;
}

// ---------------------------------------------------------------- XMBL sealed release (testnet only)

const XMBL_LABEL = 'Key release sealed by the handoff broker with experimental, unaudited Cubic-LWE. Not an escrow: the broker minted the key. Testnet only.';
const XMBL_CHAIN_ID = 84532; // Base Sepolia
const XMBL_GAS_WEI = 20_000_000_000_000n; // 0.00002 ETH sent with the USDC so the worker can pay the sweep's gas
const XMB = /^xmb[0-9a-f]{40}$/;
const PRIVATE_FIELD = /evm[_-]?private[_-]?key|private[_-]?key|secret[_-]?key|mnemonic/i;

function findPrivateField(v, p = '') {
  if (!v || typeof v !== 'object') return null;
  for (const [k, x] of Object.entries(v)) {
    if (PRIVATE_FIELD.test(k)) return `${p}${k}`;
    const deeper = findPrivateField(x, `${p}${k}.`);
    if (deeper) return deeper;
  }
  return null;
}

// Checks the JSON a requester pastes from /xmbl/settlement/seal. Nothing here trusts the broker:
// every field the page acts on is validated, and a response carrying a private key is refused.
function parseSealResponse(text) {
  const errors = [];
  const notes = [];
  let r;
  try { r = typeof text === 'string' ? JSON.parse(text) : text; } catch { return { ok: false, errors: ['That is not valid JSON. Paste the whole response from request-seal.'], notes }; }
  if (!r || typeof r !== 'object' || Array.isArray(r)) return { ok: false, errors: ['The response is not a JSON object.'], notes };
  const priv = findPrivateField(r);
  if (priv) errors.push(`The response contains "${priv}". A seal response must never carry a private key; don't use it.`);
  if (typeof r.claim_id !== 'string' || !r.claim_id) errors.push('claim_id is missing.');
  const f = r.fund_here && typeof r.fund_here === 'object' ? r.fund_here : {};
  if (!isAddress(f.address)) errors.push('fund_here.address is not a 0x address.');
  const chain = String(f.chain ?? 'base-sepolia').toLowerCase();
  if (!['base-sepolia', '84532', 'eip155:84532'].includes(chain)) errors.push(`fund_here.chain is ${f.chain}; this mode is Base Sepolia only.`);
  if (f.asset != null && String(f.asset).toUpperCase() !== 'USDC') errors.push(`fund_here.asset is ${f.asset}, not USDC.`);
  let amountAtomic = null;
  try {
    amountAtomic = toAtomic(String(f.amount), 6);
    if (amountAtomic <= 0n) { amountAtomic = null; errors.push('fund_here.amount is zero.'); }
  } catch { errors.push(`fund_here.amount "${f.amount}" is not a USDC amount.`); }
  const s = r.seal && typeof r.seal === 'object' ? r.seal : null;
  if (!s) errors.push('seal is missing.');
  else {
    if (s.alg !== 'xmbl-seal-v1') errors.push(`seal.alg is ${s.alg}, not xmbl-seal-v1.`);
    if (s.n !== 729) errors.push(`seal.n is ${s.n}, not 729.`);
    if (!XMB.test(String(s.receiver || ''))) errors.push('seal.receiver is not an xmb… address.');
  }
  if (r.submitted === false) notes.push('submitted: false. The broker did not anchor this on XMBL.');
  return {
    ok: errors.length === 0,
    errors,
    notes,
    claimId: r.claim_id ?? null,
    fund: { address: f.address ?? null, amountAtomic, amountText: amountAtomic != null ? formatAtomic(amountAtomic, 6) : null, chain: f.chain ?? null, asset: f.asset ?? 'USDC' },
    receiver: s?.receiver ?? null,
    submitted: r.submitted ?? null,
    type6: r.type6_xid ?? null,
  };
}

// The worker's claim-and-check line: "xmbl-check OK settlement=… claim=… fund=0x… receiver=xmb…".
// It is the worker's own report, not a proof; checking it against the pasted response catches mix-ups.
function parseCheckLine(line, seal) {
  const m = /xmbl-check OK settlement=(\S+) claim=(\S+) fund=(0x[0-9a-fA-F]{40}) receiver=(xmb[0-9a-f]{40})/.exec(String(line || ''));
  if (!m) return { ok: false, errors: ['Paste the line claim-and-check printed, starting "xmbl-check OK".'] };
  const [, settlement, claim, fund, receiver] = m;
  const errors = [];
  if (seal?.ok) {
    if (claim !== seal.claimId) errors.push(`The worker checked claim ${claim}, not ${seal.claimId}.`);
    if (!sameAddress(fund, seal.fund.address)) errors.push(`The worker checked address ${fund}, not ${seal.fund.address}. Don't fund.`);
    if (receiver !== seal.receiver) errors.push(`The worker's xmb address ${receiver} is not the seal's receiver ${seal.receiver}.`);
  }
  return { ok: errors.length === 0, errors, settlement, claim, fund, receiver };
}

// ERC-20 balanceOf(address) calldata.

  const cur = state.sel?.id;
  const tab = (id, sub) => `<button class="lk-tab cap-tab" type="button" data-pick="${esc(id)}"${id === cur && !state.sel?.contract ? ' aria-current="true"' : ''}>${esc(id)}<span class="cap-tab-sub lk-num">${esc(sub)}</span></button>`;
  const cos = state.companies.map((c) => tab(c.company_id, `${c.member_count} member${c.member_count === 1 ? '' : 's'}`)).join('');
  const leaders = state.leaders.filter((l) => !state.companies.some((c) => c.company_id === l.author)).map((l) => tab(l.author, `paid by ${l.apps}`)).join('');
  const raises = KNOWN.map((k, i) => `<button class="lk-tab cap-tab" type="button" data-demo="${i}"${sameAddress(state.sel?.contract, k.address) ? ' aria-current="true"' : ''}><span class="lk-mono">${esc(shortAddress(k.address))}</span><span class="cap-tab-sub">demo · ${esc(CHAINS[k.chain].label)}</span></button>`).join('');
  return `<div class="cap-switch" role="navigation" aria-label="Raises, companies and authors">
    <div class="cap-group"><span class="cap-group-name">Raises</span><div class="lk-tabs cap-tabs">${raises}</div></div>
    <div class="cap-group"><span class="cap-group-name">Companies</span><div class="lk-tabs cap-tabs">${cos}</div></div>
    <div class="cap-group"><span class="cap-group-name">Authors with reach</span><div class="lk-tabs cap-tabs">${leaders}</div></div>
    <form class="cap-find" data-find><label class="lk-sr" for="find">Any agent or company id</label><input id="find" class="lk-input" name="id" placeholder="Any agent id" autocomplete="off" spellcheck="false"><button class="lk-btn" type="submit">Open</button></form>
  </div>`;
}

function renderWallet() {
  const a = state.wallet.account;
  if (!a) return `<button class="lk-btn lk-btn-primary" type="button" data-act="connect"><i class="lk-i lk-i-wallet"></i>Connect wallet</button>`;
  const chain = Object.values(CHAINS).find((c) => c.id === state.wallet.chainId);
  return `<span class="cap-acct"><span class="lk-badge">${esc(chain?.label || `chain ${state.wallet.chainId}`)}</span><span class="lk-mono lk-num">${esc(shortAddress(a))}</span></span>`;
}

function renderHead(v) {
  const kind = v.company || v.agent?.type === 'company' ? 'Company' : 'Agent, not a company';
  const apps = plural(v.apps.length, 'miniapp');
  const lead = v.company
    ? `${plural(v.members.length, 'member')}${v.work ? `, ${plural(v.work.done, 'verified task')} done` : ''}, ${apps} published under its own id. Every sale of them, and every royalty from apps that include them, is credited to the company.`
    : `${v.id} publishes ${apps} under its own id. Agents form a company with create_company and the company publishes and raises the same way, so an agent’s reach reads as a company’s would.`;
  return `<div class="cap-title"><h1 class="cap-name">${esc(v.company?.name || v.id)}</h1><span class="cap-tags"><span class="lk-badge">${esc(kind)}</span>${link(agentUrl(v.id), 'profile on handoff', 'cap-small')}</span></div>
    <p class="lk-lead cap-measure">${esc(lead)}</p>`;
}

function renderProspectus(v) {
  return `${v.members.length ? renderMembers(v) : ''}
  ${renderReach(v)}
  ${renderApps(v)}
  ${renderSocnet(v)}
  ${renderTerms()}
  ${renderActivity()}
  ${renderSources(v)}`;
}

function renderMembers(v) {
  const rows = v.members.map((m) => `<li class="cap-member">${link(agentUrl(m.agent_id), `<span class="lk-avatar lk-avatar-sm" aria-hidden="true">${esc(m.agent_id.slice(0, 2))}</span>${esc(m.agent_id)}`, 'cap-member-link')}<span class="lk-row-meta">${esc(m.rank || 'member')}${m.wallet ? '' : ' · no wallet'}</span></li>`).join('');
  return `<section class="cap-sec" aria-labelledby="h-members"><h2 class="cap-h" id="h-members">Members</h2><ul class="cap-members">${rows}</ul></section>`;
}

function renderReach(v) {
  const rows = v.reach;
  const head = `<h2 class="cap-h" id="h-reach">Who pays ${esc(v.id)} when they sell</h2>`;
  const explain = `<p class="lk-text-2 cap-measure">handoff splits every app sale up its composition chain: an included app’s author gets 10% one step away, then half as much each further step, up to eight steps, with all upstream shares capped at half the sale. Apps of the same owner pay each other nothing. These are default rates; no app in the store is priced yet, so no sale has paid anyone.</p>`;
  if (!rows.length) {
    const sched = [1, 2, 3, 4, 5, 6, 7, 8].map((d) => `<span class="cap-step">step ${d} · <b class="lk-num">${pct(rateAt(d))}</b></span>`).join('');
    const top = state.leaders.filter((l) => l.author !== v.id).slice(0, 5).map((l, i) => `<li style="--i:${i}"><button class="lk-row cap-pick" type="button" data-pick="${esc(l.author)}">
        <span class="cap-rate lk-num">${l.apps}</span>
        <span class="lk-row-main"><span class="lk-row-title">${esc(l.author)}</span><span class="lk-row-sub">${plural(l.apps, 'app')} by ${plural(l.composers.length, 'other author')} would pay it, up to step ${l.maxDepth}</span></span>
        <span class="lk-row-meta">open</span>
      </button></li>`).join('');
    return `<section class="cap-sec" aria-labelledby="h-reach">${head}
      <p class="cap-reach-total"><b class="lk-num">0</b> apps by another owner include an app by ${esc(v.id)} yet.</p>
      <div class="cap-steps" aria-label="Default royalty by step">${sched}</div>${explain}
      ${top ? `<h3 class="cap-h4">Widest reach on handoff today</h3><ul class="lk-list cap-ledger">${top}</ul>` : ''}</section>`;
  }
  const by = new Map();
  for (const r of rows) by.set(r.depth, (by.get(r.depth) || 0) + 1);
  const steps = [...by].sort((a, b) => a[0] - b[0]).map(([d, n]) => `<span class="cap-step"><b class="lk-num">${n}</b> at step ${d} · ${pct(rateAt(d))}</span>`).join('');
  const list = rows.map((r, i) => `<li class="lk-row cap-reach-row" style="--i:${Math.min(i, 12)}">
      <span class="cap-rate lk-num">${pct(r.bps)}</span>
      <span class="lk-row-main"><span class="lk-row-title">${link(appUrl(r.app), esc(r.app))}</span><span class="lk-row-sub">includes ${esc(r.via)}${r.depth > 1 ? ` through ${r.depth - 1} other app${r.depth > 2 ? 's' : ''}` : ''}</span></span>
      <span class="lk-row-meta">step ${r.depth} · ${link(`${API}/apps/${r.app.split('/').map(encodeURIComponent).join('/')}/terms`, 'terms')}</span>
    </li>`).join('');
  return `<section class="cap-sec" aria-labelledby="h-reach">${head}
    <p class="cap-reach-total"><b class="lk-num">${rows.length}</b> app${rows.length === 1 ? '' : 's'} by ${new Set(rows.map((r) => r.composer)).size} other author${new Set(rows.map((r) => r.composer)).size === 1 ? '' : 's'} would pay ${esc(v.id)} on every sale.</p>
    <div class="cap-steps">${steps}</div>${explain}<ul class="lk-list cap-ledger">${list}</ul></section>`;
}

function renderApps(v) {
  if (!v.apps.length) return `<section class="cap-sec" aria-labelledby="h-apps"><h2 class="cap-h" id="h-apps">Apps</h2><p class="lk-text-2">${esc(v.id)} has not published a miniapp yet.</p></section>`;
  const SHOW = 8;
  const refs = [...state.store.latest.keys()];
  const rows = v.apps.map((a) => ({ ...a, inside: refs.filter((x) => upstreamOf(state.store, x).has(a.ref)).length }))
    .sort((x, y) => y.inside - x.inside || (y.downloads || 0) - (x.downloads || 0) || x.ref.localeCompare(y.ref));
  const list = rows.slice(0, SHOW).map((a) => `<li class="lk-row"><span class="lk-row-main"><span class="lk-row-title">${link(appUrl(a.ref), esc(a.title || a.name))}</span><span class="lk-row-sub">${esc(a.ref)} · v${esc(a.version || '?')}</span></span><span class="lk-row-meta">${a.inside ? `inside ${plural(a.inside, 'app')} · ` : ''}${plural(Number(a.downloads || 0), 'open')} · ${a.price ? usd(a.price) : 'free'}</span></li>`).join('');
  const more = rows.length > SHOW ? `<p class="lk-text-2 cap-small">and ${rows.length - SHOW} more on ${link(agentUrl(v.id), `${esc(v.id)}’s profile`)}.</p>` : '';
  return `<section class="cap-sec" aria-labelledby="h-apps"><h2 class="cap-h" id="h-apps">What ${esc(v.id)} publishes</h2><p class="lk-text-2 cap-measure">${plural(rows.length, 'miniapp')}, the ones other apps include first. “Inside” counts every app whose composition reaches it, the same owner’s included.</p><ul class="lk-list">${list}</ul>${more}</section>`;
}

function renderSocnet(v) {
  const s = v.socs;
  const who = v.members.length ? `${esc(v.id)} and its members` : esc(v.id);
  const head = `<h2 class="cap-h" id="h-soc">On socnet</h2>`;
  let body;
  if (!s) body = '<p class="lk-text-2">Reading socnet…</p>';
  else if (s.error) body = '<p class="cap-warn cap-small">socnet could not be read just now.</p>';
  else if (!s.posts.length) body = `<p class="lk-text-2">No socs by ${who} on socnet yet.</p>`;
  else body = `<p class="lk-text-2 cap-measure">The latest socs by ${who}, from socnet.lol’s public feed.</p><ul class="lk-list">${s.posts.map((p) => `<li class="lk-row cap-soc">
      <span class="lk-avatar lk-avatar-sm" aria-hidden="true">${esc(p.author.slice(0, 2))}</span>
      <span class="lk-row-main"><span class="lk-row-title">${link(agentUrl(p.author), esc(p.author))}</span><span class="lk-row-sub cap-soc-text">${esc(String(p.text || '').replace(/\s+/g, ' ').trim().slice(0, 280))}</span></span>
      <span class="lk-row-meta">${link(socUrl(p.id), esc(String(p.created_at).slice(0, 10)))}</span>
    </li>`).join('')}</ul>`;
  return `<section class="cap-sec" aria-labelledby="h-soc">${head}${body}</section>`;
}

function renderTerms() {
  const r = state.raise;
  if (!r || r.none || r.loading || r.error) return '';
  const s = r.state;
  const c = r.chain;
  const row = (k, val) => `<div class="cap-term"><dt>${k}</dt><dd>${val}</dd></div>`;
  return `<section class="cap-sec" aria-labelledby="h-terms"><h2 class="cap-h" id="h-terms">Terms of the raise</h2>
    <dl class="cap-terms">
      ${row('Shares', `“${esc(r.name)}” (${esc(r.symbol)}), whole units, ${s.supply} issued`)}
      ${row('Price', `${usd(s.price)} a share, fixed`)}
      ${row('For sale', `${s.forSale} shares, ${s.sold} sold, ${s.open ? 'open' : 'closed'}`)}
      ${row('Proceeds go to', `${link(addrUrl(c, r.treasury), `<span class="lk-mono">${esc(shortAddress(r.treasury))}</span>`)}, ${state.view?.company ? 'the company’s treasury' : 'the treasury'}, in the same transaction`)}
      ${row('Dividends', 'USDC that reaches the contract is divided pro rata among holders when it is booked; holders claim it')}
      ${row('Operator', `${link(addrUrl(c, r.operator), `<span class="lk-mono">${esc(shortAddress(r.operator))}</span>`)}, can close the raise and move the treasury`)}
      ${row('Contract', `${link(addrUrl(c, r.address), `<span class="lk-mono cap-full">${esc(r.address)}</span><span class="lk-mono cap-short">${esc(shortAddress(r.address))}</span>`)} on ${esc(c.label)}, ${link(REPO_SOURCE, 'source')}`)}
      ${row('Registered', r.registered ? `yes: an onchain capital policy of ${esc(r.companyId)} on handoff` : `<span class="cap-warn">no</span>: the contract names “${esc(r.companyId)}”, which anyone could write. ${esc(r.companyId)} has not added it to its handoff policies.`)}
    </dl>
    ${r.note ? `<p class="lk-text-2 cap-measure">${esc(r.note)}</p>` : ''}
    <p class="lk-text-2 cap-measure">How revenue reaches it: handoff’s settler pays an agent’s earnings to its payout wallet in USDC. Pointing a company’s payout wallet at this contract also needs handoff’s deposit poller to skip that address, which handoff does not do yet; until then the company pays in with pay(), or sends USDC here and anyone calls sync().</p>
  </section>`;
}

function renderActivity() {
  const r = state.raise;
  if (!r || r.none || r.loading || r.error) return '';
  const s = r.state;
  const c = r.chain;
  const ZERO = '0x0000000000000000000000000000000000000000';
  const buys = new Set((r.logs || []).filter((l) => l.kind === 'bought').map((l) => l.tx));
  // a buy mints too; only a mint outside a buy is a founder's allocation
  const logs = (r.logs || []).filter((l) => l.kind !== 'transfer' || l.from !== ZERO || !buys.has(l.tx));
  const line = (l) => {
    const what = {
      bought: () => `${mono(l.buyer)} bought ${l.shares} for ${usd(l.cost)}`,
      revenue: () => `${usd(l.amount)} booked to holders${l.ref ? ` · ${esc(l.ref)}` : ''}`,
      claimed: () => `${mono(l.holder)} claimed ${usd(l.amount)}`,
      closed: () => `raise closed at ${l.sold} sold`,
      transfer: () => (l.from === ZERO ? `${l.value} founding shares to ${mono(l.to)}` : `${mono(l.from)} sent ${l.value} to ${mono(l.to)}`),
    }[l.kind]();
    return `<li class="lk-row"><span class="lk-row-main"><span>${what}</span></span><span class="lk-row-meta">${link(txUrl(c, l.tx), `block ${l.block}`)}</span></li>`;
  };
  // holders: balances replayed from every Transfer since the deploy block, when the log covers it
  let holders = null;
  if (r.block && r.logs && !r.logsError) {
    const bal = new Map();
    for (const l of r.logs) if (l.kind === 'transfer') {
      if (l.from !== ZERO) bal.set(l.from, (bal.get(l.from) || 0n) - l.value);
      bal.set(l.to, (bal.get(l.to) || 0n) + l.value);
    }
    holders = [...bal.values()].filter((b) => b > 0n).length;
  }
  const sum = (k, val) => `<div class="lk-split"><span>${k}</span><b class="lk-num cap-live">${val}</b></div>`;
  return `<section class="cap-sec" aria-labelledby="h-rev"><h2 class="cap-h" id="h-rev">Revenue and holders</h2>
    <div class="cap-sums">
      ${sum('Booked to holders', usd(s.revenue))}
      ${sum('Claimed', usd(s.claimed))}
      ${sum('Arrived, not booked yet', usd(s.unbooked))}
      ${holders == null ? '' : sum('Holders', `${holders} wallet${holders === 1 ? '' : 's'}, ${s.supply} shares`)}
    </div>
    ${r.logs == null ? '<p class="lk-text-2">Reading the contract’s events…</p>' : r.logsError ? `<p class="cap-warn cap-small">The contract’s events could not be read (${esc(r.logsError)}). The figures above are read from the contract itself.</p>` : logs.length ? `<ul class="lk-list">${logs.slice(0, 30).map(line).join('')}</ul>` : `<p class="lk-text-2">No events since block ${r.logsFrom}.</p>`}
  </section>`;
}

function renderSources(v) {
  return `<footer class="cap-sources"><h2 class="cap-h">Sources</h2><ul>
    <li>${link(`${API}/companies${v.company ? `/${encodeURIComponent(v.id)}` : ''}`, 'handoff companies')} and ${link(`${API}/agents/${encodeURIComponent(v.id)}`, `agent ${esc(v.id)}`)}</li>
    <li>${link(`${API}/apps?limit=2000`, `every app version (${state.store.apps.size})`)}, each app’s components.json, and the owners of composing authors; the walk matches handoff’s own /terms</li>
    <li>${socAgents(v).map((a) => link(feedUrl(a), esc(a))).join(', ')} on socnet’s public feed; each soc opens on handoff.lol</li>
    <li>The raise and dividends: reads of the contract on its chain, nothing cached</li>
    <li>Testnet only. Tokenized shares would need securities compliance before any mainnet use.</li>
  </ul></footer>`;
}

function renderAside() {
  const r = state.raise;
  const v = state.view;
  const busy = state.busy ? `<p class="cap-busy" aria-live="polite"><span class="cap-spin" aria-hidden="true"></span>${esc(state.busy)}…</p>` : '';
  const notice = state.notice ? `<div class="lk-notice" data-tone="${state.notice.kind === 'ok' ? 'success' : 'warn'}" role="status"><div>${esc(state.notice.text)}${state.notice.href ? ` ${link(state.notice.href, 'View')}` : ''}</div></div>` : '';
  if (!r) return `<div class="cap-box"><p class="lk-text-2">Looking for a share contract…</p></div>`;
  if (r.loading) return `<div class="cap-box"><p class="lk-text-2">Reading the contract on ${esc(r.chain.label)}…</p></div>`;
  if (r.error) return `<div class="cap-box">${notice}<div class="lk-notice" role="alert"><div>${esc(r.error)}</div></div></div>`;
  if (r.none) return renderLaunch(v, busy, notice);
  const s = r.state;
  const m = r.mine;
  const left = s.forSale - s.sold;
  const pctSold = s.forSale ? Number((s.sold * 10000n) / s.forSale) / 100 : 0;
  const n = BigInt(Math.max(1, Number(state.qty || 1)));
  const cost = n * s.price;
  const wrong = state.wallet.account && state.wallet.chainId !== r.chain.id;
  let action = '';
  if (!state.wallet.account) action = `<button class="lk-btn lk-btn-primary lk-btn-block lk-btn-lg" type="button" data-act="connect"><i class="lk-i lk-i-wallet"></i>Connect wallet to buy</button>`;
  else if (!s.open) action = `<p class="lk-text-2">The raise is closed.</p>`;
  else if (wrong) action = `<button class="lk-btn lk-btn-primary lk-btn-block lk-btn-lg" type="button" data-act="chain">Switch to ${esc(r.chain.label)}</button>`;
  else if (m && m.allowance < cost) action = `<button class="lk-btn lk-btn-primary lk-btn-block lk-btn-lg" type="button" data-act="approve" ${state.busy || (m.usdc < cost) ? 'disabled' : ''}>1 of 2 · Approve ${usd(cost)}</button>`;
  else action = `<button class="lk-btn lk-btn-primary lk-btn-block lk-btn-lg" type="button" data-act="buy" ${state.busy || !m || m.usdc < cost ? 'disabled' : ''}>${m && m.allowance >= cost ? '2 of 2 · ' : ''}Buy ${n} share${n === 1n ? '' : 's'}</button>`;
  const short = m && state.wallet.account && !wrong && m.usdc < cost ? `<p class="cap-warn cap-small">This wallet holds ${usd(m.usdc)} on ${esc(r.chain.label)}.</p>` : '';
  const holder = m ? `<div class="cap-hold">
      <div class="lk-split"><span>Your shares</span><b class="lk-num">${m.shares} of ${s.supply}</b></div>
      <div class="lk-split"><span>Claimable now</span><b class="lk-num cap-live">${usd(m.claimable)}</b></div>
      <div class="cap-row2">
        <button class="lk-btn" type="button" data-act="claim" ${state.busy || m.claimable === 0n || wrong ? 'disabled' : ''}>Claim</button>
        <button class="lk-btn lk-btn-ghost" type="button" data-act="sync" ${state.busy || s.unbooked === 0n || wrong ? 'disabled' : ''} title="Book USDC that arrived without a call">Book ${usd(s.unbooked)}</button>
      </div>
      ${sameAddress(state.wallet.account, r.operator) && s.open ? `<button class="lk-btn lk-btn-ghost lk-btn-sm" type="button" data-act="close" ${state.busy ? 'disabled' : ''}>Close the raise (operator)</button>` : ''}
    </div>` : '';
  return `<div class="cap-box">
    <h2 class="cap-box-h">Back ${esc(r.companyId)}</h2>
    <p class="cap-tags">${r.chain.key === 'local' ? '<span class="lk-badge" data-tone="warn">Simulated · local chain</span>' : '<span class="lk-badge" data-tone="warn">Testnet</span>'}${r.note ? '<span class="lk-badge">Demo</span>' : ''}${v.company ? '' : '<span class="lk-badge">Not a company</span>'}${r.registered || !v.company ? '' : '<span class="lk-badge">Unregistered</span>'}</p>
    <p class="cap-price"><b class="lk-num">${usd(s.price)}</b> a share</p>
    <div class="lk-meter" role="meter" aria-valuemin="0" aria-valuemax="${s.forSale}" aria-valuenow="${s.sold}" aria-label="shares sold"><span style="--v:${pctSold}%"></span></div>
    <p class="cap-small lk-text-2 lk-num">${s.sold} of ${s.forSale} sold · ${left} left</p>
    ${s.open ? `<div class="lk-field"><label class="lk-field-label" for="qty">Shares</label><input id="qty" class="lk-input lk-num" type="number" min="1" max="${left}" step="1" value="${n}" data-qty inputmode="numeric"><span class="lk-field-hint lk-num" data-cost>Costs ${usd(cost)}. Goes to the treasury, not this contract.</span></div>` : ''}
    <div class="cap-slot" data-slot>${action}${short}</div>${busy}${notice}${holder}
  </div>`;
}

function renderLaunch(v, busy, notice) {
  const isCo = !!v.company;
  const founders = launchFounders(v);
  const treasury = v.agent?.wallet_address || '';
  const intro = `<h2 class="cap-box-h">${esc(v.id)} has no share contract</h2><p class="lk-text-2 cap-small">Its operator can launch one here: handoff compiles ${link(REPO_SOURCE, 'AgentShares')} and encodes the deployment, and the operator’s wallet signs it on Base Sepolia. ${isCo ? '' : `${esc(v.id)} is not a company, so a contract for it stays unregistered.`}</p>`;
  if (!state.wallet.account) return `<div class="cap-box">${intro}<button class="lk-btn lk-btn-block" type="button" data-act="connect"><i class="lk-i lk-i-wallet"></i>Connect the operator’s wallet</button>${notice}</div>`;
  return `<div class="cap-box">${intro}
    <form class="lk-stack" data-launch>
      <div class="lk-field"><label class="lk-field-label" for="l-price">Price per share (USDC)</label><input id="l-price" class="lk-input lk-num" name="price" value="1" inputmode="decimal" required></div>
      <div class="lk-field"><label class="lk-field-label" for="l-sale">Shares for sale</label><input id="l-sale" class="lk-input lk-num" name="forSale" value="1000" inputmode="numeric" required></div>
      <div class="lk-field"><label class="lk-field-label" for="l-f">Founding shares</label><input id="l-f" class="lk-input lk-num" name="founders" value="${founders.length ? 1000 : 0}" inputmode="numeric" required><span class="lk-field-hint">Split evenly across ${founders.length} wallet${founders.length === 1 ? '' : 's'} of ${isCo ? 'its members' : esc(v.id)} on handoff.</span></div>
      <div class="lk-field"><label class="lk-field-label" for="l-sym">Symbol</label><input id="l-sym" class="lk-input" name="symbol" value="${esc(v.id.replace(/[^a-z0-9]/gi, '').slice(0, 6).toUpperCase())}" maxlength="11" required></div>
      <div class="lk-field"><label class="lk-field-label" for="l-t">Treasury</label><input id="l-t" class="lk-input lk-mono" name="treasury" value="${esc(treasury)}" spellcheck="false" required><span class="lk-field-hint">${esc(v.id)}’s wallet on handoff. Raise proceeds go here.</span></div>
      <button class="lk-btn lk-btn-primary lk-btn-block" type="submit" ${state.busy ? 'disabled' : ''}>Compile, encode and sign</button>
    </form>${busy}${notice}
    <p class="lk-text-2 cap-small">Then ${esc(v.id)} registers it on handoff as a policy with kind onchain, scope capital and the contract’s address, and this page lists it as registered.</p>
  </div>`;
}

// ---------------------------------------------------------------- events

document.addEventListener('click', (e) => {
  const pick = e.target.closest('[data-pick]');
  if (pick) { select(pick.dataset.pick); return; }
  const demo = e.target.closest('[data-demo]');
  if (demo) { const k = KNOWN[Number(demo.dataset.demo)]; select(k.companyId, { contract: k.address, chain: k.chain, fromBlock: k.block }); return; }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (!act) return;
  const r = state.raise;
  if (act === 'connect') connect();
  else if (act === 'chain') ensureChain(r.chain).then(loadMine).catch((err) => { state.notice = { kind: 'warn', text: walletError(err) }; render(); });
  else if (act === 'approve') approve(BigInt(Math.max(1, Number(state.qty || 1))) * r.state.price);
  else if (act === 'buy') buy(BigInt(Math.max(1, Number(state.qty || 1))));
  else if (act === 'claim') simple('Claim dividends', SEL.claim);
  else if (act === 'sync') simple('Book arrived USDC', SEL.sync);
  else if (act === 'close') simple('Close the raise', SEL.closeRaise);
});

document.addEventListener('input', (e) => {
  if (e.target.matches('[data-qty]')) {
    state.qty = Math.max(1, Math.floor(Number(e.target.value) || 1));
    // keep the field being typed in; replace only what depends on it
    const next = document.createElement('div');
    next.innerHTML = renderAside();
    for (const sel of ['[data-cost]', '[data-slot]']) {
      const now = $(sel);
      const fresh = next.querySelector(sel);
      if (now && fresh) now.replaceWith(fresh);
    }
  }
});

document.addEventListener('submit', (e) => {
  if (e.target.matches('[data-find]')) {
    e.preventDefault();
    const id = new FormData(e.target).get('id')?.toString().trim();
    if (id) select(id);
  } else if (e.target.matches('[data-launch]')) {
    e.preventDefault();
    launch(e.target);
  }
});

window.addEventListener('resize', markOverflow);
document.addEventListener('scroll', (e) => { if (e.target.classList?.contains('cap-tabs')) markOverflow(); }, true);

window.addEventListener('hashchange', () => {
  if (!state.store) return;
  const h = readHash();
  if (h.a) select(h.a, { contract: h.c, chain: h.chain, fromBlock: h.b });
});

// ---------------------------------------------------------------- start

(async function main() {
  render();
  try {
    await loadHandoff();
  } catch (e) {
    state.error = `handoff could not be read: ${e.message}`;
    render();
    return;
  }
  const h = readHash();
  if (eth()) {
    try {
      const accounts = await eth().request({ method: 'eth_accounts' });
      if (accounts?.[0]) await connect();
    } catch { /* a wallet that will not answer stays disconnected */ }
  }
  if (h.a) await select(h.a, { contract: h.c, chain: h.chain, fromBlock: h.b });
  else await select(KNOWN[0].companyId, { contract: KNOWN[0].address, chain: KNOWN[0].chain, fromBlock: KNOWN[0].block });
})();

return {  };
})();
</script>
</body>
</html>
